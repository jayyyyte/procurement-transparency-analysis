# Cấu hình pipeline. Mọi đường dẫn là tương đối so với thư mục gốc repo.
# Có thể override bằng CLI: python run_pipeline.py crawl --start 2024-01-01 --end 2024-03-31

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  sample_dir: data/sample
  fixture_dir: data/fixture
  reports_dir: reports
  figures_dir: reports/figures
  tables_dir: reports/tables
  logs_dir: logs
  checkpoint_db: data/checkpoint.sqlite
  province_mapping: config/province_mapping.csv

crawl:
  base_url: https://muasamcong.mpi.gov.vn
  # Điền email liên hệ của team trước khi crawl thật
  user_agent: "ptvn-capstone/0.1 (HUST IT4142E student project; contact: <team-email>)"
  # Cửa sổ thời gian: mặc định 48 tháng tính ngược từ ngày chạy; start_date/end_date (YYYY-MM-DD) override nếu khác null
  months_back: 48
  start_date: null
  end_date: null
  sources: [tbmt, khlcnt, kqlcnt]
  min_delay_s: 1.5          # tối thiểu giữa 2 request
  jitter_s: 0.5             # cộng thêm ngẫu nhiên [0, jitter_s]
  timeout_s: 30
  max_retries: 5
  backoff_base_s: 2.0       # backoff = base * 2^attempt (hoặc Retry-After nếu server gửi)
  max_consecutive_errors: 10  # circuit breaker
  page_size: 10             # endpoint trang chủ từ chối pageSize > 10 (Phase 0)
  max_result_window: 10000  # giới hạn phân trang kiểu Elasticsearch (from + size)
  raw_batch_size: 500       # số bản ghi raw mỗi file .jsonl.gz

  # ---- GATE PHASE 0 ----
  # Full crawl bị khoá cho tới khi chủ dự án/giảng viên chọn phương án trong reports/phase0_feasibility.md.
  # Giá trị hợp lệ: null (khoá) | "A" (HTTP, endpoint không gắn reCAPTCHA) | "B" (trình duyệt thật, chưa implement)
  approved_option: null

  endpoints:
    # Endpoint trang chủ dùng (không gắn reCAPTCHA; pageSize tối đa 10) — chỉ crawl quy mô lớn khi approved_option = "A"
    home_search: /o/egp-portal-home/services/smart/search
    # Endpoint trang tìm kiếm nâng cao — GẮN reCAPTCHA v3 (?token=...): chỉ được probe 1 lần ở Phase 0, không crawl
    advanced_search: /o/egp-portal-contractor-selection-v2/services/smart/search
  # Filter theo nguồn (type/stepCode/date field) nằm trong src/crawler/es_query.py
  # Chiến lược (reports/phase0_feasibility.md §4): mặc định S1 = 3 nguồn độc lập.
  # S2: KQLCNT chỉ lấy caseKHKQ=1, vì KQ của gói có TBMT đã nằm sẵn trong bản ghi TBMT (bước 4) -> ~15% ít request:
  #   kqlcnt: [{fieldName: caseKHKQ, searchType: in, fieldValues: ["1"]}]
  extra_filters:
    kqlcnt: []

clean:
  # Danh sách API không có field "nguồn vốn". Proxy tạm thời: planType của KHLCNT
  # (DTPT = đầu tư phát triển, TX = chi thường xuyên, DTMS = dự toán mua sắm, KHAC = khác).
  # Mặc định coi 3 loại đầu là chi từ ngân sách nhà nước, loại KHAC — CẦN CHỦ DỰ ÁN XÁC NHẬN tại gate Phase 0.
  nsnn_plan_types: [DTPT, TX, DTMS]
  # ratio = gia_trung_thau / gia_goi_thau; ngoài khoảng này bị gắn cờ outlier
  ratio_outlier_low: 0.3
  ratio_outlier_high: 1.2

model:
  random_state: 42
  target: tiet_kiem_pct     # tiet_kiem_pct | log_gia_trung
  use_bidder_count: false   # số nhà thầu chỉ biết sau mở thầu -> mặc định không dùng làm feature (tránh leakage)
  test_months: 6            # time-based split: 6 tháng cuối làm test
  cv_folds: 5
  min_rows: 200             # dưới ngưỡng này không train (dataset quá nhỏ)
  max_train_rows: 300000    # lấy mẫu nếu dataset lớn hơn (RF + CV trên máy cá nhân)

anomaly:
  near_full_ratio: 0.99     # giá trúng / giá gói >= ngưỡng -> gần như không tiết kiệm
  repeat_window_days: 180   # cửa sổ xét "thắng liên tiếp"
  repeat_min_wins: 3        # số lần thắng tối thiểu tại cùng bên mời thầu trong cửa sổ
  weights: {single_bidder: 0.4, near_full_price: 0.3, repeat_winner: 0.3}
  contamination: 0.05       # tỉ lệ gói được mỗi thuật toán gắn cờ (để so sánh đồng thuận)
  lof_neighbors: 35
  lof_max_rows: 150000      # LOF tốn O(n log n)–O(n^2): fit trên mẫu nếu lớn hơn, chấm điểm toàn bộ
  top_k: 20

optional:
  kmeans: true              # §7.3 K-means phân khúc gói thầu
  network: true             # §7.3 community detection bên mời thầu <-> nhà thầu
